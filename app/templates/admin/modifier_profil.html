{% extends "base/base_admin.html" %}
{% block title %}Mon Profil — VoyageIQ{% endblock %}

{% block content %}
<div class="admin-page">
  <div class="page-header">
    <h1 class="page-title"><i class="fas fa-user-edit"></i> Modifier Mon Profil</h1>
  </div>

  <div class="section-card">
    <form action="{{ url_for('admin.modifier_profil') }}" method="POST" enctype="multipart/form-data">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}">
      
      <div style="display: flex; gap: 30px; align-items: flex-start; margin-bottom: 30px;">
        <div class="user-avatar-upload" style="text-align: center;">
          <div class="user-avatar-large" style="width: 120px; height: 120px; border-radius: 50%; overflow: hidden; background: var(--bg3); margin-bottom: 10px;">
            {% if current_user.photo %}
              <img src="{{ url_for('static', filename='images/avatars/' ~ current_user.photo) }}" style="width:100%; height:100%; object-fit:cover;">
            {% else %}
              <div style="font-size: 40px; line-height: 120px;">{{ current_user.nom[:1] }}</div>
            {% endif %}
          </div>
          <label class="btn btn-sm btn-secondary" style="cursor:pointer;">
            Changer photo
            <input type="file" name="photo" style="display:none;" accept="image/*">
          </label>
        </div>

        <div style="flex: 1;" class="form-grid">
          <div class="form-group">
            <label class="form-label">Nom</label>
            <input type="text" name="nom" class="form-input" value="{{ current_user.nom }}" required>
          </div>
          <div class="form-group">
            <label class="form-label">Prénom</label>
            <input type="text" name="prenom" class="form-input" value="{{ current_user.prenom or '' }}">
          </div>
          <div class="form-group">
            <label class="form-label">Téléphone</label>
            <input type="tel" name="telephone" class="form-input" value="{{ current_user.telephone }}" required>
          </div>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-input" value="{{ current_user.email or '' }}">
          </div>
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Enregistrer les modifications</button>
    </form>
  </div>
</div>
{% endblock %}
