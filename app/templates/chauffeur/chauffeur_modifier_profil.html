{% extends "base/base_chauffeur.html" %}
{% block title %}Modifier Profil — VoyageIQ{% endblock %}

{% block content %}
<div class="chauf-page-header">
  <h1 class="chauf-page-title">Éditer mon profil</h1>
</div>

<div class="card">
  <form action="{{ url_for('chauffeur.modifier_profil') }}" method="POST" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}">
    
    <div style="text-align: center; margin-bottom: 30px;">
      <div class="chauf-avatar-lg" id="imagePreview" style="margin: 0 auto 15px;">
        {% if chauffeur.photo %}<img src="{{ url_for('static', filename='images/chauffeurs/' ~ chauffeur.photo) }}">{% else %}<span>{{ chauffeur.nom[:1] }}</span>{% endif %}
      </div>
      <label class="btn btn--outline btn--sm" style="cursor: pointer;">
        Changer la photo
        <input type="file" name="photo" id="photoInput" style="display: none;" accept="image/*">
      </label>
    </div>

    <div class="form-group">
      <label class="form-label">Nom complet</label>
      <input type="text" name="nom" class="form-input" value="{{ chauffeur.nom }}" required>
    </div>

    <div class="form-group">
      <label class="form-label">Téléphone</label>
      <input type="tel" name="telephone" class="form-input" value="{{ chauffeur.telephone }}" required>
    </div>

    <div style="margin-top: 30px; display: flex; gap: 10px;">
      <button type="submit" class="btn btn--gold btn--full">Sauvegarder les modifications</button>
      <a href="{{ url_for('chauffeur.profil') }}" class="btn btn--ghost">Annuler</a>
    </div>
  </form>
</div>
{% endblock %}

{% block page_js %}
<script>
document.getElementById('photoInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
            const preview = document.getElementById('imagePreview');
            preview.innerHTML = `<img src="${event.target.result}">`;
        };
        reader.readAsDataURL(file);
    }
});
</script>
{% endblock %}
